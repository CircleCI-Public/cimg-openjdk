version: 2.1

orbs:
  cimg: circleci/cimg@0.6.6
  slack: circleci/slack@5.1.1

parameters:
  cron:
    type: boolean
    default: false
  release-sha:
    type: string
    default: ""

jobs:
  test-template:
    executor: cimg/default
    steps:
      - checkout
      - run:
          name: Check for template build changes
          command: |
            git fetch --no-tags origin refs/heads/main
            if git diff --quiet FETCH_HEAD HEAD -- Dockerfile.template temurin-release.sh manifest shared .gitmodules .circleci/config.yml; then
              circleci step halt
            fi
      - run:
          name: Generate a Dockerfile with a pinned Temurin patch release
          command: |
            git -c submodule.shared.url=https://github.com/CircleCI-Public/cimg-shared.git submodule update --init shared
            bash ./temurin-release.sh generate '25.0.5.1#jdk-25.0.5.1+2'
      - setup_remote_docker
      - run:
          name: Log in to Docker Hub when credentials are available
          command: |
            if [[ -n ${DOCKER_TOKEN:-} && -n ${DOCKER_USER:-} ]]; then
              printf '%s\n' "$DOCKER_TOKEN" |
                docker login --username "$DOCKER_USER" --password-stdin
            else
              echo 'Docker Hub credentials unavailable. Pulling public images anonymously.'
            fi
      - run:
          name: Build and run the generated OpenJDK image
          command: |
            docker buildx build --load --platform linux/amd64 --tag cimg-openjdk-template-check:ci --file 25.0/Dockerfile .
            docker run --rm --network=none cimg-openjdk-template-check:ci java -version 2>&1 | grep -F 'Temurin-25.0.5.1+2'
  test:
    executor:
      name: cimg/default
      resource_class: 2xlarge+.gen2
    steps:
      - checkout
      - run:
          name: Test release scripts
          command: python3 -B -m unittest discover -s tests
      - run:
          name: Prepare versions for the diff check
          command: bash .circleci/prepare-release.sh versions
      - setup_remote_docker
      - cimg/check-diff
      - run:
          name: Prepare staging tags
          command: bash .circleci/prepare-release.sh
      - cimg/build-images:
          docker-namespace: ccitest
          docker-repository: openjdk
  restage-release:
    executor:
      name: cimg/default
      resource_class: 2xlarge+.gen2
    steps:
      - checkout:
          method: full
      - run:
          name: Prepare all staging builds for the requested release
          environment:
            RELEASE_SHA: << pipeline.parameters.release-sha >>
          command: bash .circleci/restage-release.sh "$RELEASE_SHA"
      - setup_remote_docker
      - cimg/build-images:
          publish-branch: never-main
          docker-namespace: ccitest
          docker-repository: openjdk
  deploy:
    executor:
      name: cimg/default
      resource_class: 2xlarge+.gen2
    steps:
      - checkout
      - run:
          name: Check for a release commit
          command: |
            if [[ $(git log -1 --format=%s) != *'[release]'* ]]; then
              circleci step halt
            fi
      - setup_remote_docker
      - run:
          name: Publish the checked-out release
          command: bash .circleci/publish-release.sh

workflows:
  automated-wf:
    when:
      and:
        - << pipeline.parameters.cron >>
        - equal: ["", << pipeline.parameters.release-sha >>]
    jobs:
      - cimg/update:
          update-script: openJDKFeed.sh
          context:
            - slack-notification-access-token
            - slack-cimg-notifications
            - cpe-image-bot-github-creds
  main-wf:
    when:
      and:
        - not: << pipeline.parameters.cron >>
        - equal: ["", << pipeline.parameters.release-sha >>]
    jobs:
      - test-template:
          context:
            - cimg-docker-image-building
          filters:
            branches:
              ignore:
                - main
      - test:
          name: "Test"
          filters:
            branches:
              ignore:
                - main
          context: 
            - slack-notification-access-token
            - slack-cimg-notifications
            - cimg-docker-image-building
          post-steps:
            - slack/notify:
                branch_pattern: main
                event: fail
                mentions: "@images"
                template: basic_fail_1
      - deploy:
          name: "Deploy"
          serial-group: << pipeline.project.slug >>/publish
          filters:
            branches:
              only:
                - main
          context:
            - slack-notification-access-token
            - slack-cimg-notifications
            - cimg-docker-image-building
            - cimg-docker-image-publishing
          post-steps:
            - slack/notify:
                branch_pattern: main
                event: fail
                mentions: "@images"
                template: basic_fail_1
  restage-wf:
    when:
      not:
        equal: ["", << pipeline.parameters.release-sha >>]
    jobs:
      - restage-release:
          context:
            - cimg-docker-image-building
          filters:
            branches:
              only:
                - main
